name: Game Upload Notifier
on:
  push:
    paths:
      - '**.zip'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          
      - name: Send Discord Announcement
        run: |
          # 1. Find the uploaded zip file name
          FILE=$(git diff --name-only HEAD^ HEAD | grep '\.zip$' | head -n 1)
          if [ -z "$FILE" ]; then exit 0; fi
          
          # 2. Extract AppID from filename (e.g. gets 4010900 from 4010900.zip)
          APP_ID=$(basename "$FILE" .zip)
          
          # 3. Fetch Game Name from Steam (Bypassing age-gates)
          STEAM_DATA=$(curl -s -A "Mozilla/5.0" --cookie "birthtime=283993201; lastagecheckage=1-January-1979;" "https://store.steampowered.com/api/appdetails?appids=${APP_ID}")
          GAME_NAME=$(echo "$STEAM_DATA" \vert{} jq -r ".[\"${APP_ID}\"].data.name // empty")
          
          # Fallback just in case Steam errors out
          if [ -z "$GAME_NAME" ] \vert{}\vert{} [ "$GAME_NAME" = "null" ]; then
            GAME_NAME="App $APP_ID"
          fi
          
          # 4. Construct Steam Header Image URL
          IMAGE_URL="https://steamcdn-a.akamaihd.net/steam/apps/${APP_ID}/header.jpg"
          
          # 5. Build and send the Discord Webhook
          curl -H "Content-Type: application/json" -X POST -d "$(jq -n \
            --arg title "$GAME_NAME Added!" \
            --arg desc "The game file \`$FILE\` has been successfully uploaded to the database." \
            --arg img "$IMAGE_URL" \
            --arg id "$APP_ID" \
            '{
              username: "Effectless Database",
              content: "🎮 **New Game File Available!**",
              embeds: [{
                title: $title,
                description: $desc,
                color: 5814783,
                image: { url: $img },
                fields: [
                  { name: "AppID", value: $id, inline: true }
                ]
              }]
            }')" ${{ secrets.WEBHOOK_URL }}
